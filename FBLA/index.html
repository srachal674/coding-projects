<!DOCTYPE html>
<html>

<head>
    <title>ISAZVA FBLA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Title Bar -->
    <div class="card">
        <div class="flex-container">
            <h1>ISAZVA Chapter Hub</h1>
            <img src="assets/FBLA.jpg" alt="FBLA Logo">
        </div>
    </div>

    <!-- Carousel of Chapter Photos and Announcements -->
    <div id="carouselMultiple" class="carousel slide" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <!-- Randon Image carousel of FBLA images-->
        <div class="carousel-inner" id="carouselStacked">
            <div class="carousel-item active"><img id="photo1" src="" alt="FBLA chapter photo"
                    class="d-block w-100 rounded-5"></div>
            <div class="carousel-item"><img id="photo2" src="" alt="FBLA chapter photo" class="d-block w-100 rounded-5">
            </div>
            <div class="carousel-item"><img id="photo3" src="" alt="FBLA chapter photo" class="d-block w-100 rounded-5">
            </div>
        </div>
    </div>
    <hr>

    <div class="d-flex flex-row flex-wrap gap-3 mb-3 hub-columns">
        <div class="p-3 hub-column calendar-column">
            <h2>Dates to Remember</h2>
            <div id="calendar"></div>
        </div>
        <div class="p-3 hub-column announcements-column">
            <h2>Announcements</h2>
            <h3>FBLA Red Zone</h3>
            <p><strong>Red Zone sign-up survey due October 29 at 5:00 p.m.</strong></p>
            <hr>
            <p>Red Zone Leadership Conference: November 13</p>
            <hr>
            <p>Cardinals vs. Rams game: Sunday, November 15</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="script.js">
    </script>
</body>

</html>
