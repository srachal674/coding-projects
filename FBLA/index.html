<!DOCTYPE html>
<html>

<head>
    <title>ISAZVA FBLA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Title Bar -->
    <div class="card">
        <div class="flex-container">
            <h1>ISAZVA Chapter Hub</h1>
            <img src="assets/FBLA.jpg" alt="FBLA Logo">
        </div>
    </div>

    <!-- Carousel of Chapter Photos -->
    <div id="carouselMultiple" class="carousel slide" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <!-- Random image carousel of FBLA images -->
        <div class="carousel-inner" id="carouselStacked">
            <div class="carousel-item active"><img id="photo1" src="" alt="FBLA chapter photo"
                    class="d-block w-100 rounded-5"></div>
            <div class="carousel-item"><img id="photo2" src="" alt="FBLA chapter photo" class="d-block w-100 rounded-5">
            </div>
            <div class="carousel-item"><img id="photo3" src="" alt="FBLA chapter photo" class="d-block w-100 rounded-5">
            </div>
        </div>
    </div>
    <hr>

    <!-- Compact announcement button -->
    <div class="announcement-bar">
        <button type="button" class="btn announcement-button" id="openAnnouncements">
            Announcements — FBLA Red Zone
        </button>
    </div>

    <!-- Dates to Remember -->
    <div class="hub-columns">
        <div class="p-3 hub-column calendar-column">
            <h2>Dates to Remember</h2>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Announcements Modal -->
    <div class="modal fade" id="announcementsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">FBLA Red Zone</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Red Zone sign-up survey due October 29 at 5:00 p.m.</strong></p>
                    <hr>
                    <p>Red Zone Leadership Conference: November 13</p>
                    <hr>
                    <p>Cardinals vs. Rams game: Sunday, November 15</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
