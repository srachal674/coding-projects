<!DOCTYPE html>
<html>

<head>
    <title>ISAZVA FBLA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Title Bar -->
    <div class="card">
        <div class="flex-container">
            <h1>ISAZVA Chapter Hub</h1>
            <img src="assets/FBLA.jpg" alt="FBLA Logo" width="8%">
        </div>
    </div>

    <!-- Carousel of Chapter Photos and Announcements -->
    <div id="carouselMultiple" class="carousel slide" data-bs-ends="stop"
        style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Three at a time</h5>
            <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-prev" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next"
                    style="--bs-carousel-control-icon-width: 1rem;">
                    <span class="carousel-icon-next" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <!-- Randon Image carousel of FBLA images-->
        <div class="carousel-item">
            <div class="btn-icon>">
                <div class="carousel-inner" id="carouselStacked">
                    <div class="carousel-item active"><img id="photo1" src="" alt="FBLA chapter photo"
                            class="d-block w-100 rounded-5"></div>
                    <div class="carousel-item"><img id="photo2" src="" alt="FBLA chapter photo"
                            class="d-block w-100 rounded-5"></div>
                    <div class="carousel-item"><img id="photo3" src="" alt="FBLA chapter photo"
                            class="d-block w-100 rounded-5"></div>
                </div>
            </div>
        </div>
    </div>

    <script>

    </script>
</body>

</html>
