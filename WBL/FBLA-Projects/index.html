<!DOCTYPE html>
<html>

<head>
    <title>FBLA-Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <!--Page Header-->
    <h1 class="page-title">Software App Design & Programming WBL Projects</h1>

    <hr>

    <!-- Project Categories -->
    <div class="outer-card">

        <div class="row accordion" id="projectAccordion">

            <!-- Coding column -->
            <div class="col">
                <div class="card accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            data-bs-target="#collapseOne">
                            Coding Projects
                        </button>
                    </h2>

                    <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#projectAccordion">

                        <div class="accordion-body">
                            <div class="btn-group-vertical w-100">

                                <!-- Coding buttons go here -->

                                <div class="container text-center">
                                    <div class="btn-group-vertical">
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Coding & Programming">Coding &
                                            Programming</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Computer Game & Simulation Programming">Computer
                                            Game
                                            & Simulation Programming</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Data Analysis">Data
                                            Analysis</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Introduction to Programming">Introduction to
                                            Programming (9th/10th only)</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Mobile Application Development">Mobile Application
                                            Development</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Website Coding & Development">Website Coding &
                                            Development</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Website Design">Website Design</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Business column starts here -->
            <div class="col">
                <div class="card accordion-item">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                Business, Marketing, & Entrepreneurship
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#projectAccordion">
                            <div class="accordion-body">
                                <div class="container text-center">
                                    <div class="btn-group-vertical w-100">
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Business Plan">Business
                                            Plan</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Event Planning">Event Planning</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Introduction to Business Presentation">Introduction
                                            to Business Presentation (9th/10th only)</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Introduction to Social Media Strategy">Introduction
                                            to Social Media Strategy (9th/10th only)</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Sales Presentation">Sales
                                            Presentation</button>
                                        <button type="button" class="btn btn-outline-primary project-button"
                                            data-project="Social Media Strategies">Social Media
                                            Strategies</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Graphics column starts here -->
            <div class="col">
                <div class="card accordion-item">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                Graphic Design
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#projectAccordion">
                            <div class="accordion-body">
                                <div class="container text-center">
                                    <div class="row">
                                        <div class="col">
                                            <div class="btn-group-vertical w-100">
                                                <button type="button" class="btn btn-outline-primary project-button"
                                                    data-project="Digital Animation">Digital
                                                    Animation</button>
                                                <button type="button" class="btn btn-outline-primary project-button"
                                                    data-project="Digital Video Production">Digital
                                                    Video
                                                    Production</button>
                                                <button type="button" class="btn btn-outline-primary project-button"
                                                    data-project="Graphic Design">Graphic
                                                    Design</button>
                                                <button type="button" class="btn btn-outline-primary project-button"
                                                    data-project="Public Service Announcement">Public
                                                    Service
                                                    Announcement</button>
                                                <button type="button" class="btn btn-outline-primary project-button"
                                                    data-project="Visual Design">Visual
                                                    Design</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reusable Project Description Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="projectModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-primary" id="copyProject">
                        Copy
                    </button>
                    <button type="button" class="btn btn-outline-primary" id="savePdf">
                        Save as PDF
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <hr>

    <footer>
        <div class="row">
            <div class="col">
                <div class="link">
                    <a href="mailto:srachal@insightaz.org">&copy Shannon L Rachal - ISAZ</a>
                </div>
            </div>
            <div class="col">
                <div class="link">
                    <a href="mailto:srachal@azva.org">&copy Shannon L Rachal - AZVA</a>
                </div>
            </div>
        </div>        
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
